<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Enquiries | Trainingslager Antalya</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    :root{--ink:#0f1c15;--muted:#5a6760;--line:rgba(15,28,21,.1);--green:#1f6247;--gold:#e3a92f;--bg:#fafaf7}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif}
    .shell{max-width:1280px;margin:0 auto;padding:32px 20px 56px}h1{font-size:clamp(30px,5vw,52px);margin:0}
    .muted{color:var(--muted)}.toolbar,.stats{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:24px 0}
    input,button,select{font:inherit;padding:10px 14px;border:1px solid rgba(15,28,21,.18);border-radius:10px;background:#fff;min-height:42px}input:focus,select:focus{outline:0;border-color:var(--green);box-shadow:0 0 0 4px rgba(31,98,71,.14)}
    button{background:var(--green);color:#fff;border:0;cursor:pointer;font-weight:700;border-radius:999px;padding:10px 20px}button:hover{background:#154733}button:disabled{opacity:.5;cursor:default}.stats{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr))}
    .stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px}.stat strong{display:block;font-size:26px;color:var(--green)}
    .table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}
    table{border-collapse:collapse;width:100%;min-width:850px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f1f4ef;color:var(--ink);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
    .error{color:#a42626}.success{color:#18733d}.empty{text-align:center;padding:30px}
    @media(max-width:600px){.shell{padding:24px 14px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}}
  </style>
</head>
<body>
<main class="shell">
  <p class="muted">ANTALYA CAMP · INTERNAL</p><h1>Enquiry dashboard</h1>
  <p class="muted">Review, filter and follow up on the latest training-camp requests.</p>
  <div class="toolbar"><input id="key" type="password" placeholder="Admin API key" autocomplete="off"><input id="search" placeholder="Search club, contact or email" disabled><select id="statusFilter" disabled><option value="">All statuses</option><option>new</option><option>contacted</option><option>closed</option></select><button id="load">Load enquiries</button><button id="refresh" type="button" disabled>Refresh</button></div>
  <p id="message" class="muted" role="status"></p><div class="stats"><div class="stat"><span class="muted">Total</span><strong id="total">—</strong></div><div class="stat"><span class="muted">New</span><strong id="newCount">—</strong></div><div class="stat"><span class="muted">Contacted/closed</span><strong id="doneCount">—</strong></div></div>
  <div class="table-wrap"><table><thead><tr><th>Date</th><th>Club/contact</th><th>Trip</th><th>Services</th><th>Status</th></tr></thead><tbody id="rows"><tr><td class="empty" colspan="5">Enter your key and load enquiries.</td></tr></tbody></table></div>
</main>
<script src="/admin.js" defer></script>
</body>
</html>
